name: Actualización de Base de Datos
on:
  schedule:
    # 15:00 UTC es 12:00 PM Argentina (UTC-3)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4 
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar Dependencias del Sistema (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Instalar Librerías de Python y Camoufox
        run: |
          pip install -r requirements.txt
          python -m camoufox fetch
          
      - name: Ejecutar Actualización
        env:
          CAMOUFOX_CRASH_REPORT_ENABLED: "false"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python api.py
        
      - name: Guardar Cambios en GitHub
        id: commit_step
        run: |
          git config --global user.name "Bot de Actualización"
          git config --global user.email "actions@github.com"
          git add ARGSTATS.db update_log.txt
          
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No hay cambios para subir."
          else
            git commit -m "Auto-update: DB y Logs $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Disparar Deploy en Render
        if: steps.commit_step.outputs.changes == 'true'
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}