<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ARG STATS{% endblock %}</title>
    <meta name="author" content="MartinezGalo & francoqdev">
    <meta name="copyright" content="ARG STATS">
    <link rel="icon" href="{{ url_for('static', filename='lpf.png') }}?v=2" type="image/png">
    
    <!-- Fonts: Poppins (Primary) & Roboto (Secondary) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;700&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        primary: ['Poppins', 'sans-serif'],
                        secondary: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --font-primary: 'Poppins', sans-serif;
            --font-secondary: 'Roboto', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: var(--font-secondary);
        }

        h1, h2, h3, h4, .text-3xl, .text-4xl, .text-5xl, .font-black {
            font-family: var(--font-primary);
        }

        .text-xs, .text-[9px], .text-[10px], .text-[11px], .text-[12px], .font-mono {
            font-family: var(--font-secondary);
        }
    </style>
    
    <!-- D3.js, d3-hexbin & heatmap.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-hexbin@0.2.2/build/d3-hexbin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}px-10 py-6{% endblock %}">
    {% block content %}{% endblock %}
    
    {% include 'player_modal.html' %}
    {% include 'footer.html' %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
